<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
    <title>My Note Pro - NEET Edition</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;500;600;700&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- html2pdf Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Custom CSS Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Header & Profile -->
        <div class="top-header-wrapper">
            <div class="header-left">
                <div class="logo-area" onclick="goHome()" title="Go Home">
                    <div class="logo-icon"><i class="fas fa-book-open"></i></div>
                    <h1 class="app-title">My Note Pro</h1>
                </div>
            </div>
            
            <div class="profile-section">
                <div class="profile-img-wrapper" onclick="document.getElementById('profile-img-upload').click()" title="Change Profile Picture">
                    <img alt="Profile" id="profile-img" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&h=150&q=80" />
                    <input accept="image/*" id="profile-img-upload" onchange="updateProfileImg(event)" style="display: none;" type="file" />
                </div>
                <div class="profile-name" contenteditable="true" id="profile-name" onblur="saveProfileName()" title="Click to edit name">NEET Aspirant</div>
            </div>

            <div class="header-actions">
                <button class="theme-toggle-btn" id="theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
                    <i class="fas fa-moon" id="theme-icon"></i>
                </button>
                <div class="live-clock">
                    <div class="time" id="live-time">00:00:00 AM</div>
                    <div class="date" id="live-date">...</div>
                </div>
            </div>
        </div>

        <!-- Main Toolbar -->
        <div class="toolbar">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input id="search-input" oninput="filterNotes()" placeholder="Search notes, NEET topics..." type="text" />
                <div class="filter-tools">
                    <button class="clear-date-btn" id="clear-date-btn" onclick="clearDateFilter()" title="Clear Date Filter">
                        <i class="fas fa-times"></i>
                    </button>
                    <div class="calendar-btn" title="Search notes by Date">
                        <i class="fas fa-calendar-alt"></i>
                        <input id="date-search-input" onchange="filterByDate()" type="date" />
                    </div>
                </div>
            </div>

            <button class="btn-add" onclick="openModal()">
                <i class="fas fa-pen-nib"></i> Write Note
            </button>
        </div>

        <!-- Quick Subject Slider -->
        <div class="quick-subjects-wrapper" id="quick-subjects-slider">
            <div class="subject-circle-item" onclick="filterBySubject('Biology')">
                <div class="subject-ring bio-ring">
                    <img alt="Biology" src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=150&h=150&q=80" />
                </div>
                <span>Biology</span>
            </div>
            <div class="subject-circle-item" onclick="filterBySubject('Zoology')">
                <div class="subject-ring zoo-ring">
                    <img alt="Zoology" src="https://images.unsplash.com/photo-1530026405186-ed1ea0ac7a63?auto=format&fit=crop&w=150&h=150&q=80" />
                </div>
                <span>Zoology</span>
            </div>
            <div class="subject-circle-item" onclick="filterBySubject('Physics')">
                <div class="subject-ring phy-ring">
                    <img alt="Physics" src="https://images.unsplash.com/photo-1635070041078-e363dbe005cb?auto=format&fit=crop&w=120&120&q=80" />
                </div>
                <span>Physics</span>
            </div>
            <div class="subject-circle-item" onclick="filterBySubject('Chemistry')">
                <div class="subject-ring chem-ring">
                    <img alt="Chemistry" src="https://images.unsplash.com/photo-1532187863486-abf9d39d66e8?auto=format&fit=crop&w=120&120&q=80" />
                </div>
                <span>Chemistry</span>
            </div>
            <div class="subject-circle-item" onclick="filterBySubject('Trash')">
                <div class="subject-ring trash-ring" style="align-items: center; background: var(--surface-color); display: flex; justify-content: center;">
                    <i class="fas fa-trash-alt" style="color: var(--danger-color); font-size: 26px;"></i>
                </div>
                <span style="color: var(--danger-color);">Recycle Bin</span>
            </div>
            <div class="subject-circle-item" onclick="filterBySubject('')">
                <div class="subject-ring all-ring">
                    <img alt="All Notes" src="https://images.unsplash.com/photo-1506784983877-45594efa4cbe?auto=format&fit=crop&w=120&120&q=80" />
                </div>
                <span>All Notes</span>
            </div>
        </div>

        <!-- Notes Grid Area -->
        <div class="notes-grid" id="notes-container"></div>
    </div>

    <!-- Floating Action Button -->
    <button class="fab-add-btn" id="fab-add-btn" onclick="openModal()" title="Add New Note">
        <i class="fas fa-plus"></i>
    </button>

    <!-- READ-ONLY VIEW MODAL -->
    <div class="modal-overlay" id="view-modal">
        <div class="modal-content full-screen">
            <div class="modal-header">
                <div class="header-left-group" style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
                    <h2><i class="fas fa-book-open"></i> Note Viewer</h2>
                    <div class="date-stamp" id="view-date-stamp" style="color: var(--text-muted); font-size: 12px;"></div>
                </div>
                <div class="header-column-controls">
                    <button class="header-save-btn" id="view-edit-btn" onclick=""><i class="fas fa-pen"></i> Edit Note</button>
                    <button class="close-modal-btn" onclick="closeViewModal()"><i class="fas fa-times"></i> Close</button>
                </div>
            </div>
            
            <div class="modal-body" id="view-modal-body">
                <div class="view-note-title" id="view-note-title"></div>
                <div class="view-note-body" id="view-note-content"></div>
            </div>
        </div>
    </div>

    <!-- FULL SCREEN EDITOR MODAL -->
    <div class="modal-overlay" id="editor-modal">
        <div class="modal-content full-screen">
            <div class="modal-header">
                <div class="header-left-group" style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
                    <h2 id="modal-heading"><i class="fas fa-edit"></i> Create New Note</h2>
                    <div class="date-stamp" id="editor-date-stamp" style="color: var(--text-muted); font-size: 12px;">
                        <i class="fas fa-clock"></i> <span id="current-entry-time"></span>
                    </div>
                </div>
                <div class="header-column-controls">
                    <button class="pin-toggle-btn is-private" id="modal-pin-btn" onclick="toggleModalPrivacy()">
                        <i class="fas fa-lock" id="modal-pin-icon"></i> <span id="modal-pin-text">Private Note</span>
                    </button>
                    <button class="close-modal-btn" onclick="closeModal()"><i class="fas fa-times"></i> Close</button>
                    <button class="header-save-btn" onclick="saveNoteAndClose()"><i class="fas fa-check-circle"></i> Save Note</button>
                </div>
            </div>
            
            <div class="modal-body">
                <div class="editor-header-with-logo">
                    <div class="editor-logo-changer">
                        <i class="fas fa-sticky-note" style="font-size: 22px; color: var(--primary-color);"></i>
                    </div>
                    <input class="editor-title" id="note-title" placeholder="Note Title..." type="text">
                </div>

                <div class="editor-toolbar">
                    <button onclick="execCmd('bold')" title="Bold"><i class="fas fa-bold"></i></button>
                    <button onclick="execCmd('italic')" title="Italic"><i class="fas fa-italic"></i></button>
                    <button onclick="execCmd('underline')" title="Underline"><i class="fas fa-underline"></i></button>
                    <button onclick="execCmd('insertUnorderedList')" title="Bullet List"><i class="fas fa-list-ul"></i></button>
                    <button onclick="execCmd('insertOrderedList')" title="Numbered List"><i class="fas fa-list-ol"></i></button>
                    <input type="color" onchange="execCmd('foreColor', this.value)" title="Text Color">
                </div>

                <div class="editor-container">
                    <div class="rich-editor-area" contenteditable="true" id="note-editor" data-placeholder="Start typing your note here..."></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Custom JS Link -->
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
    <title>My Note Pro</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;500;600;700&family=Playfair+Display:ital,wght@1,500&family=Roboto+Mono&family=Caveat:wght@600&family=Lobster&family=Pacifico&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* ===== Reset & Base Layout ===== */
        header, .header, #header, .navbar, nav, #sidebar-wrapper, .sidebar {
          display: none !important;
        }

        :root {
            --bg-color: #f4f7f6 !important; 
            --surface-color: #ffffff !important;
            --text-main: #2d3748 !important;
            --text-muted: #718096 !important;
            --primary-color: #4f46e5 !important; 
            --border-color: #e2e8f0 !important;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.04) !important;
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08) !important;
            --shadow-lg: 0 15px 30px rgba(0,0,0,0.12) !important;
            --editor-toolbar-bg: #f8fafc !important;
        }

        body.dark-mode {
            --bg-color: #0f172a !important;
            --surface-color: #1e293b !important;
            --text-main: #f8fafc !important;
            --text-muted: #94a3b8 !important;
            --border-color: #334155 !important;
            --editor-toolbar-bg: #0f172a !important;
        }

        * { box-sizing: border-box !important; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--bg-color) !important; 
            color: var(--text-main) !important;
            line-height: 1.6; min-height: 100vh; overflow-x: hidden;
            display: flex; justify-content: center; transition: background 0.3s, color 0.3s;
        }
        .app-container { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: 20px; padding: 15px 0;}

        /* Header & Profile */
        .top-header-wrapper { display: flex !important; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding: 0 15px; }
        .logo-area { display: flex !important; align-items: center; gap: 10px; cursor: pointer; }
        .logo-icon { background: linear-gradient(135deg, #4f46e5, #d53f8c); color: white; width: 40px; height: 40px; display: flex !important; align-items: center; justify-content: center; border-radius: 12px; font-size: 18px; }
        .logo-area h1.app-title { font-size: 20px; font-weight: 700; color: var(--text-main) !important; margin: 0; }

        .profile-section { display: flex !important; align-items: center; gap: 12px; background: var(--surface-color) !important; padding: 8px 16px; border-radius: 9999px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); }
        .profile-img-wrapper { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; border: 2px solid #4f46e5; cursor: pointer; }
        .profile-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .profile-name { font-size: 15px; font-weight: 600; outline: none; border-bottom: 1px dashed transparent; }

        .header-actions { display: flex !important; align-items: center; gap: 12px; }
        .theme-toggle-btn { background: var(--surface-color) !important; border: 1px solid var(--border-color) !important; color: var(--text-main) !important; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
        .live-clock { text-align: right; background: var(--surface-color) !important; padding: 6px 14px; border-radius: 9999px; border: 1px solid var(--border-color); }
        .live-clock .time { font-size: 14px; font-weight: 600; color: #4f46e5; }
        .live-clock .date { font-size: 10px; color: var(--text-muted) !important; }

        /* Toolbar */
        .toolbar { display: flex !important; justify-content: space-between; align-items: center; gap: 15px; padding: 0 15px; flex-wrap: wrap; }
        .search-wrapper { flex: 1; min-width: 260px; display: flex !important; align-items: center; background: var(--surface-color) !important; border-radius: 9999px; padding: 5px 15px; border: 1px solid var(--border-color); }
        .search-wrapper input { flex: 1; border: none; background: transparent; padding: 8px; font-size: 14px; color: var(--text-main) !important; outline: none; }
        .filter-tools { display: flex; align-items: center; gap: 8px; }
        .calendar-btn { position: relative; width: 34px; height: 34px; border-radius: 50%; background: rgba(79, 70, 229, 0.1); color: #4f46e5; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .calendar-btn input[type="date"] { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        .btn-add { background: linear-gradient(135deg, #4f46e5, #4338ca) !important; color: white !important; border: none; padding: 10px 20px; border-radius: 9999px; font-weight: 600; cursor: pointer; }

        /* Progress Bar Modal Container */
        .progress-bar-container { width: 100%; background-color: #e2e8f0; border-radius: 8px; overflow: hidden; margin-top: 10px; display: none; }
        .progress-bar-fill { width: 0%; height: 12px; background: linear-gradient(90deg, #4f46e5, #d53f8c); transition: width 0.2s ease-in-out; }
        .progress-text { font-size: 12px; font-weight: 600; color: var(--primary-color); text-align: right; margin-top: 4px; display: none; }

        /* Circle Slider */
        .quick-subjects-wrapper { display: flex !important; gap: 20px; overflow-x: auto; padding: 10px 15px; scrollbar-width: none; }
        .subject-circle-item { display: flex !important; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; position: relative; flex-shrink: 0; }
        .subject-ring { width: 68px; height: 68px; border-radius: 50%; padding: 2px; border: 2.5px solid #4f46e5; background: var(--surface-color); position: relative; }
        .subject-ring img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .subject-circle-item span { font-size: 12px; font-weight: 600; color: var(--text-main); max-width: 75px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .add-subject-ring { border: 2.5px dashed #4f46e5 !important; display: flex; align-items: center; justify-content: center; color: #4f46e5; font-size: 22px; }
        .subject-delete-btn { position: absolute; top: -2px; right: -2px; background: #e53e3e; color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; border: 1px solid white; }

        /* Notes Grid */
        .notes-grid { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 0 15px; }
        .note-card { background: var(--surface-color) !important; border-radius: 18px; padding: 20px; border: 1px solid var(--border-color); display: flex !important; flex-direction: column; gap: 12px; position: relative; }
        .note-top-meta { position: absolute; top: 12px; right: 15px; display: flex; gap: 8px; font-size: 11px; font-weight: 600; }
        .like-count-tag { background: rgba(229, 62, 62, 0.1); color: #e53e3e; padding: 3px 8px; border-radius: 9999px; cursor: pointer; }
        .like-count-tag.liked { background: #e53e3e; color: #ffffff; }

        .note-card-header { display: flex; align-items: center; gap: 12px; margin-top: 15px; }
        .note-circle-logo { width: 40px; height: 40px; border-radius: 50%; background: var(--editor-toolbar-bg); display: flex; align-items: center; justify-content: center; }
        .note-author-tag { font-size: 11px; font-weight: 600; color: #4f46e5; background: rgba(79, 70, 229, 0.08); padding: 2px 8px; border-radius: 9999px; }
        .clickable-title { font-size: 16px; font-weight: 600; color: var(--text-main); cursor: pointer; }
        .note-body-html { font-size: 13px; max-height: 100px; overflow: hidden; color: var(--text-muted); word-break: break-word; }

        .note-footer { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .note-date { font-size: 11px; color: var(--text-muted); }
        .action-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--editor-toolbar-bg); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }

        .loading-spinner { text-align: center; padding: 20px; font-weight: 600; color: #4f46e5; width: 100%; }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content.full-screen { width: 100%; height: 100%; background: var(--surface-color); display: flex; flex-direction: column; }

        .modal-header { padding: 12px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; max-width: 900px; margin: 0 auto; width: 100%; }

        .editor-title { width: 100%; padding: 10px; font-size: 16px; font-weight: 600; border: 1px solid var(--border-color); border-radius: 8px; outline: none; background: var(--surface-color); color: var(--text-main); }
        .editor-toolbar { display: flex; gap: 8px; overflow-x: auto; padding: 8px; background: var(--editor-toolbar-bg); border-radius: 8px; border: 1px solid var(--border-color); }
        .editor-toolbar button { padding: 6px 12px; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; color: var(--text-main); }

        .rich-editor-area { flex: 1; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; outline: none; min-height: 250px; background: var(--surface-color); color: var(--text-main); }
        .rich-editor-area img, .rich-editor-area video { max-width: 100%; border-radius: 8px; margin: 8px 0; }

        .fab-add-btn { position: fixed; bottom: 25px; right: 25px; width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #4f46e5, #d53f8c); color: white; font-size: 20px; border: none; cursor: pointer; box-shadow: 0 8px 20px rgba(79,70,229,0.4); }

        .toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast { background: #1e293b; color: white; padding: 8px 18px; border-radius: 9999px; font-size: 13px; opacity: 0; transition: all 0.3s; }
        .toast.show { opacity: 1; }

        .simple-modal-card { background: var(--surface-color); width: 90%; max-width: 380px; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--border-color); }
        .input-group input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); margin-top: 4px; outline: none; background: var(--editor-toolbar-bg); color: var(--text-main); }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="top-header-wrapper">
            <div class="logo-area" onclick="goHome()">
                <div class="logo-icon"><i class="fas fa-book-open"></i></div>
                <h1 class="app-title">My Note Pro</h1>
            </div>
            
            <div class="profile-section">
                <div class="profile-img-wrapper" onclick="document.getElementById('profile-img-upload').click()">
                    <img alt="Profile" id="profile-img" src="" />
                    <input accept="image/*" id="profile-img-upload" onchange="updateProfileImg(event)" style="display: none;" type="file" />
                </div>
                <div class="profile-name" contenteditable="true" id="profile-name" onblur="saveProfileName()">Note Author</div>
            </div>

            <div class="header-actions">
                <button class="theme-toggle-btn" onclick="toggleTheme()"><i class="fas fa-moon" id="theme-icon"></i></button>
                <div class="live-clock">
                    <div class="time" id="live-time">00:00:00</div>
                    <div class="date" id="live-date">...</div>
                </div>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="search-wrapper">
                <i class="fas fa-search" style="color:var(--text-muted)"></i>
                <input id="search-input" oninput="handleSearch()" placeholder="Search notes..." type="text" />
                <div class="filter-tools">
                    <div class="calendar-btn">
                        <i class="fas fa-calendar-alt"></i>
                        <input id="date-search-input" onchange="filterByDate()" type="date" />
                    </div>
                </div>
            </div>

            <button class="btn-add" onclick="openModal()"><i class="fas fa-plus"></i> Write Note</button>
        </div>

        <!-- Circle Logos Slider -->
        <div class="quick-subjects-wrapper" id="quick-subjects-slider">
            <div class="subject-circle-item" onclick="filterBySubject('', this)">
                <div class="subject-ring">
                    <img alt="All" src="https://images.unsplash.com/photo-1506784983877-45594efa4cbe?auto=format&fit=crop&w=120&120&q=80" />
                </div>
                <span>All Notes</span>
            </div>

            <div class="subject-circle-item" onclick="openAddSubjectModal()">
                <div class="subject-ring add-subject-ring"><i class="fas fa-plus"></i></div>
                <span>Add Logo</span>
            </div>

            <div id="dynamic-subjects-list" style="display: flex; gap: 20px;"></div>
        </div>

        <!-- Notes Grid -->
        <div class="notes-grid" id="notes-container"></div>
        
        <!-- Infinite Scroll Loader -->
        <div id="loading-spinner" class="loading-spinner" style="display: none;">
            <i class="fas fa-spinner fa-spin"></i> Loading more notes...
        </div>
    </div>

    <button class="fab-add-btn" onclick="openModal()"><i class="fas fa-plus"></i></button>

    <!-- ADD CIRCLE LOGO MODAL -->
    <div class="modal-overlay" id="add-subject-modal">
        <div class="simple-modal-card">
            <h3>Add Circle Logo</h3>
            <div class="input-group">
                <label>Logo / Subject Name:</label>
                <input type="text" id="new-subject-name" placeholder="Name...">
            </div>
            <div class="input-group">
                <label>Circle Image File:</label>
                <input type="file" id="new-subject-file" accept="image/*">
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
                <button onclick="closeAddSubjectModal()" style="padding:6px 12px; border-radius:6px; border:1px solid var(--border-color); background:transparent; color:var(--text-main);">Cancel</button>
                <button onclick="saveNewSubjectCircle()" style="padding:6px 12px; border-radius:6px; background:#4f46e5; color:white; border:none;">Save</button>
            </div>
        </div>
    </div>

    <!-- READ-ONLY VIEW MODAL -->
    <div class="modal-overlay" id="view-modal">
        <div class="modal-content full-screen">
            <div class="modal-header">
                <h2 id="view-modal-title-header">View Note</h2>
                <button onclick="closeViewModal()" style="padding:6px 12px; border-radius:6px; border:none; background:#e53e3e; color:white;">Close</button>
            </div>
            <div class="modal-body">
                <h2 id="view-note-title"></h2>
                <div id="view-date-stamp" style="font-size:12px; color:var(--text-muted); margin-bottom:10px;"></div>
                <div id="view-note-content"></div>
            </div>
        </div>
    </div>

    <!-- EDITOR MODAL -->
    <div class="modal-overlay" id="editor-modal">
        <div class="modal-content full-screen">
            <div class="modal-header">
                <h2 id="modal-heading-text">Note Editor</h2>
                <div>
                    <button onclick="saveNoteAndClose()" style="padding:6px 14px; background:#4f46e5; color:white; border:none; border-radius:6px; font-weight:600;">Save</button>
                    <button onclick="closeModal()" style="padding:6px 12px; background:transparent; border:1px solid var(--border-color); color:var(--text-main); border-radius:6px;">Cancel</button>
                </div>
            </div>
            
            <div class="modal-body">
                <input class="editor-title" id="note-title" placeholder="Note Title..." type="text">

                <div class="editor-toolbar">
                    <button onclick="execCmd('bold')"><b>B</b></button>
                    <button onclick="execCmd('italic')"><i>I</i></button>

                    <!-- Media Upload File Input -->
                    <button onclick="document.getElementById('media-file-input').click()" style="color:#4f46e5;"><i class="fas fa-upload"></i> Upload Media</button>
                    <input type="file" id="media-file-input" accept="image/*,video/*" style="display:none;" onchange="uploadMediaFile(event)">
                </div>

                <!-- 100% Media Upload Progress Bar -->
                <div class="progress-bar-container" id="progress-container">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
                <div class="progress-text" id="progress-text">0% Uploaded</div>

                <div class="rich-editor-area" contenteditable="true" id="note-editor"></div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        // BACKEND API BASE URL
        const API_BASE_URL = '/api';

        let notes = [];
        let customSubjects = [];
        let currentEditId = null;
        let selectedSubjectFilter = '';
        let currentSearchQuery = '';
        let currentDateFilter = '';

        // Pagination State for Downward Infinite Scroll
        let currentPage = 1;
        let hasMoreNotes = true;
        let isLoadingNotes = false;

        document.addEventListener('DOMContentLoaded', () => {
            updateClock();
            setInterval(updateClock, 1000);
            
            fetchProfileFromBackend();
            fetchSubjectsFromBackend();
            fetchNotesFromBackend(true);

            // Infinite Scroll on Downward Scroll
            window.addEventListener('scroll', handleInfiniteScroll);
        });

        // 1. Downward Infinite Scroll Event Listener
        function handleInfiniteScroll() {
            if (isLoadingNotes || !hasMoreNotes) return;

            const scrollPosition = window.innerHeight + window.scrollY;
            const threshold = document.documentElement.offsetHeight - 250;

            if (scrollPosition >= threshold) {
                fetchNotesFromBackend(false);
            }
        }

        // 2. Fetch Notes from Backend API
        async function fetchNotesFromBackend(reset = false) {
            if (isLoadingNotes) return;
            isLoadingNotes = true;

            if (reset) {
                currentPage = 1;
                notes = [];
                hasMoreNotes = true;
                document.getElementById('notes-container').innerHTML = '';
            }

            document.getElementById('loading-spinner').style.display = 'block';

            try {
                let url = `${API_BASE_URL}/notes?page=${currentPage}&limit=9`;
                if (currentSearchQuery) url += `&search=${encodeURIComponent(currentSearchQuery)}`;
                if (selectedSubjectFilter) url += `&subject=${encodeURIComponent(selectedSubjectFilter)}`;
                if (currentDateFilter) url += `&date=${encodeURIComponent(currentDateFilter)}`;

                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    
                    notes = reset ? data.notes : [...notes, ...data.notes];
                    hasMoreNotes = data.hasMore;
                    currentPage++;

                    renderNotesGrid();
                }
            } catch (err) {
                showToast('Server connection failed', 'error');
            } finally {
                isLoadingNotes = false;
                document.getElementById('loading-spinner').style.display = 'none';
            }
        }

        function renderNotesGrid() {
            const container = document.getElementById('notes-container');
            container.innerHTML = '';

            if(notes.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color:var(--text-muted);">No Notes Found</div>`;
                return;
            }

            notes.forEach(note => {
                const card = document.createElement('div');
                card.className = 'note-card';
                const noteId = note._id;
                const likesCount = note.likes || 0;
                const isLiked = note.userLiked || false;

                card.innerHTML = `
                    <div class="note-top-meta">
                        <span class="like-count-tag ${isLiked ? 'liked' : ''}" onclick="toggleLike(event, '${noteId}')" title="Like Note">
                            <i class="${isLiked ? 'fas' : 'far'} fa-heart"></i> ${likesCount}
                        </span>
                    </div>

                    <div class="note-card-header">
                        <div class="note-circle-logo"><i class="fas fa-book" style="color: #4f46e5;"></i></div>
                        <div>
                            <span class="note-author-tag">${escapeHtml(note.subject || 'General')}</span>
                            <h3 class="clickable-title" onclick="viewNote('${noteId}')">${escapeHtml(note.title)}</h3>
                        </div>
                    </div>
                    
                    <div class="note-body-html" onclick="viewNote('${noteId}')">${note.content}</div>

                    <div class="note-footer">
                        <div class="note-date"><i class="far fa-clock"></i> ${note.createdAt}</div>
                        <div>
                            <button class="action-btn" onclick="openModal('${noteId}')" style="color:#4f46e5;"><i class="fas fa-pen"></i></button>
                            <button class="action-btn" onclick="deleteNote('${noteId}')" style="color:#e53e3e;"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 3. Like Toggle - Updates Directly to Backend
        async function toggleLike(event, noteId) {
            event.stopPropagation();
            const note = notes.find(n => n._id === noteId);
            if (!note) return;

            note.userLiked = !note.userLiked;
            note.likes = note.userLiked ? (note.likes || 0) + 1 : Math.max(0, (note.likes || 0) - 1);

            renderNotesGrid();

            try {
                await fetch(`${API_BASE_URL}/notes/${noteId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ likes: note.likes, userLiked: note.userLiked })
                });
            } catch (err) {
                console.error('Failed to save like on server:', err);
            }
        }

        // 4. Delete Note - Deletes Directly from Backend
        async function deleteNote(id) {
            if(confirm('Permanently delete this note from backend storage?')) {
                try {
                    const res = await fetch(`${API_BASE_URL}/notes/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        showToast('Note deleted from backend!', 'success');
                        fetchNotesFromBackend(true);
                    }
                } catch (err) {
                    showToast('Failed to delete note from server', 'error');
                }
            }
        }

        // 5. Media Upload with 100% Progress Bar
        function uploadMediaFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('media', file);

            const xhr = new XMLHttpRequest();
            const progressBar = document.getElementById('progress-container');
            const progressFill = document.getElementById('progress-fill');
            const progressText = document.getElementById('progress-text');

            progressBar.style.display = 'block';
            progressText.style.display = 'block';

            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressFill.style.width = percent + '%';
                    progressText.innerText = `${percent}% Uploaded to backend...`;
                }
            });

            xhr.onreadystatechange = function () {
                if (xhr.readyState === XMLHttpRequest.DONE) {
                    if (xhr.status === 200) {
                        const response = JSON.parse(xhr.responseText);
                        insertMediaToEditor(response.url, file.type);
                        showToast('Media uploaded 100%!', 'success');
                    } else {
                        showToast('Failed to upload file', 'error');
                    }
                    setTimeout(() => {
                        progressBar.style.display = 'none';
                        progressText.style.display = 'none';
                        progressFill.style.width = '0%';
                    }, 1500);
                }
            };

            xhr.open('POST', `${API_BASE_URL}/upload`, true);
            xhr.send(formData);
            event.target.value = '';
        }

        function insertMediaToEditor(url, type) {
            const editor = document.getElementById('note-editor');
            editor.focus();
            let html = type.startsWith('image/') ? 
                `<p><img src="${url}" style="max-width:100%; border-radius:8px;"></p><br>` :
                `<p><video src="${url}" controls style="max-width:100%; border-radius:8px;"></video></p><br>`;
            document.execCommand('insertHTML', false, html);
        }

        // 6. Circle Logos / Subjects API (Add & Delete)
        async function fetchSubjectsFromBackend() {
            try {
                const res = await fetch(`${API_BASE_URL}/subjects`);
                if (res.ok) {
                    customSubjects = await res.json();
                    renderSubjectCircles();
                }
            } catch (err) { console.warn(err); }
        }

        function renderSubjectCircles() {
            const container = document.getElementById('dynamic-subjects-list');
            container.innerHTML = '';

            customSubjects.forEach(sub => {
                const item = document.createElement('div');
                item.className = 'subject-circle-item';
                
                item.innerHTML = `
                    <div class="subject-ring" onclick="filterBySubject('${sub.name}', this.parentElement)">
                        <img alt="${escapeHtml(sub.name)}" src="${sub.img}" />
                    </div>
                    <span>${escapeHtml(sub.name)}</span>
                    <button class="subject-delete-btn" onclick="deleteSubjectCircle(event, '${sub.id}')" title="Delete Circle Logo"><i class="fas fa-times"></i></button>
                `;
                container.appendChild(item);
            });
        }

        async function saveNewSubjectCircle() {
            const name = document.getElementById('new-subject-name').value.trim();
            const fileInput = document.getElementById('new-subject-file');
            
            if (!name) {
                showToast('Please enter logo name', 'error');
                return;
            }

            let imgUrl = 'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&w=120&120&q=80';

            if (fileInput.files[0]) {
                const formData = new FormData();
                formData.append('media', fileInput.files[0]);
                const uploadRes = await fetch(`${API_BASE_URL}/upload`, { method: 'POST', body: formData });
                if (uploadRes.ok) {
                    const uploadData = await uploadRes.json();
                    imgUrl = uploadData.url;
                }
            }

            try {
                const res = await fetch(`${API_BASE_URL}/subjects`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, img: imgUrl })
                });

                if (res.ok) {
                    closeAddSubjectModal();
                    fetchSubjectsFromBackend();
                    showToast('Circle logo added!', 'success');
                }
            } catch (err) {
                showToast('Failed to add logo', 'error');
            }
        }

        async function deleteSubjectCircle(event, id) {
            event.stopPropagation();
            if(confirm('Delete this circle logo from backend?')) {
                try {
                    const res = await fetch(`${API_BASE_URL}/subjects/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        fetchSubjectsFromBackend();
                        showToast('Logo deleted!', 'success');
                    }
                } catch (err) {
                    showToast('Failed to delete logo', 'error');
                }
            }
        }

        // Profile APIs
        async function fetchProfileFromBackend() {
            try {
                const res = await fetch(`${API_BASE_URL}/profile`);
                if (res.ok) {
                    const p = await res.json();
                    document.getElementById('profile-name').innerText = p.name;
                    document.getElementById('profile-img').src = p.img;
                }
            } catch (err) { console.warn(err); }
        }

        async function saveProfileName() {
            const name = document.getElementById('profile-name').innerText;
            await fetch(`${API_BASE_URL}/profile`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            showToast('Profile updated', 'success');
        }

        async function updateProfileImg(event) {
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('media', file);
            const res = await fetch(`${API_BASE_URL}/upload`, { method: 'POST', body: formData });
            if (res.ok) {
                const data = await res.json();
                document.getElementById('profile-img').src = data.url;
                await fetch(`${API_BASE_URL}/profile`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ img: data.url })
                });
                showToast('Profile picture updated!', 'success');
            }
        }

        // Save Note
        async function saveNoteAndClose() {
            const title = document.getElementById('note-title').value.trim();
            const content = document.getElementById('note-editor').innerHTML.trim();

            if(!title && !content) return showToast('Cannot save empty note!', 'error');

            const payload = {
                title: title || 'Untitled Note',
                content: content,
                subject: selectedSubjectFilter || 'General',
                createdAt: new Date().toLocaleDateString([], { month: 'short', day: 'numeric' })
            };

            const method = currentEditId ? 'PUT' : 'POST';
            const url = currentEditId ? `${API_BASE_URL}/notes/${currentEditId}` : `${API_BASE_URL}/notes`;

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    showToast('Note saved to server!', 'success');
                    closeModal();
                    fetchNotesFromBackend(true);
                }
            } catch (err) {
                showToast('Failed to save note', 'error');
            }
        }

        // Read Note
        function viewNote(id) {
            const note = notes.find(n => n._id === id);
            if(!note) return;

            document.getElementById('view-modal-title-header').innerText = note.title;
            document.getElementById('view-note-title').innerText = note.title;
            document.getElementById('view-note-content').innerHTML = note.content;
            document.getElementById('view-date-stamp').innerText = `${note.createdAt} | Likes: ${note.likes || 0}`;
            document.getElementById('view-modal').classList.add('active');
        }

        // Helpers
        function handleSearch() {
            currentSearchQuery = document.getElementById('search-input').value.trim();
            fetchNotesFromBackend(true);
        }

        function filterBySubject(subject, element) {
            selectedSubjectFilter = subject;
            fetchNotesFromBackend(true);
        }

        function filterByDate() {
            const val = document.getElementById('date-search-input').value;
            if(!val) return;
            currentDateFilter = new Date(val).toLocaleDateString([], { month: 'short', day: 'numeric' });
            fetchNotesFromBackend(true);
        }

        function goHome() {
            selectedSubjectFilter = '';
            currentSearchQuery = '';
            currentDateFilter = '';
            document.getElementById('search-input').value = '';
            fetchNotesFromBackend(true);
        }

        function openModal(id = null) {
            currentEditId = id;
            if(id) {
                const n = notes.find(x => x._id === id);
                document.getElementById('note-title').value = n.title;
                document.getElementById('note-editor').innerHTML = n.content;
            } else {
                document.getElementById('note-title').value = '';
                document.getElementById('note-editor').innerHTML = '';
            }
            document.getElementById('editor-modal').classList.add('active');
        }

        function closeModal() { document.getElementById('editor-modal').classList.remove('active'); }
        function closeViewModal() { document.getElementById('view-modal').classList.remove('active'); }
        function openAddSubjectModal() { document.getElementById('add-subject-modal').classList.add('active'); }
        function closeAddSubjectModal() { document.getElementById('add-subject-modal').classList.remove('active'); }
        function execCmd(cmd) { document.execCommand(cmd, false, null); }

        function updateClock() {
            const now = new Date();
            document.getElementById('live-time').innerText = now.toLocaleTimeString();
            document.getElementById('live-date').innerText = now.toLocaleDateString();
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }

        function showToast(msg, type='info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast show';
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 2500);
        }

        function escapeHtml(text) {
            return (text || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>

<!doctype>
<html lang="en">
<head>
    <meta charset="UTF-8"></meta>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"></meta>
    <title>My Note Pro</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;500;600;700&amp;family=Playfair+Display:ital,wght@1,500&amp;display=swap" rel="stylesheet"></link>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"></link>
    <!-- Socket.io Library for Real-time Stats -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        /* CSS Variables & Custom Reset */
        :root {
            --bg-color: #f4f7f6; 
            --surface-color: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --primary-color: #4f46e5; 
            --primary-hover: #4338ca;
            --danger-color: #e53e3e;
            --voice-color: #d53f8c; 
            --border-color: #e2e8f0;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --radius-md: 12px;
            --radius-pill: 9999px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; min-height: 100vh; overflow-x: hidden; }
        
        .app-container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }

        .top-header-wrapper { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { background: linear-gradient(135deg, var(--primary-color), var(--voice-color)); color: white; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 20px; }
        
        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .search-wrapper { flex: 1; max-width: 600px; display: flex; align-items: center; background: var(--surface-color); border-radius: var(--radius-pill); padding: 5px 15px; border: 1px solid var(--border-color); }
        .search-wrapper input { width: 100%; border: none; background: transparent; padding: 10px; color: var(--text-main); outline: none; }

        .btn-add { background: var(--primary-color); color: white; border: none; padding: 12px 24px; border-radius: var(--radius-pill); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }

        /* Notes Grid */
        .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        .note-card { background: var(--surface-color); border-radius: var(--radius-md); padding: 20px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 12px; position: relative; }
        
        .note-stats-counter { display: flex; align-items: center; gap: 15px; font-size: 13px; color: var(--text-muted); margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border-color); }
        .like-btn { cursor: pointer; color: var(--text-muted); transition: var(--transition); }
        .like-btn.liked { color: var(--voice-color); }

        .loader-wrapper { text-align: center; padding: 20px; font-weight: 600; color: var(--text-muted); display: none; }
        .loader-wrapper.active { display: block; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="top-header-wrapper">
        <div class="logo-area">
            <div class="logo-icon"><i class="fa-solid fa-note-sticky"></i></div>
            <h1>My Note Pro</h1>
        </div>
        <button class="btn-add" onclick="createNewNotePrompt()"><i class="fa-solid fa-plus"></i> Add Note</button>
    </div>

    <div class="toolbar">
        <div class="search-wrapper">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search notes..." oninput="handleSearch()">
        </div>
    </div>

    <!-- Notes Container -->
    <div class="notes-grid" id="notesGrid"></div>

    <!-- Infinite Scroll Loader -->
    <div class="loader-wrapper" id="loader">
        <i class="fa-solid fa-spinner fa-spin"></i> Loading more notes...
    </div>
</div>

<script>
    const API_BASE = "https://my-note-pro-1.onrender.com/api/notes";
    const socket = io("https://my-note-pro-1.onrender.com");

    let currentPage = 1;
    let hasMore = true;
    let isLoading = false;
    let currentSearch = "";

    // Socket Event: Listen to Live Realtime Views and Likes Updates
    socket.on('statUpdated', (data) => {
        const viewsEl = document.getElementById(`views-${data.noteId}`);
        const likesEl = document.getElementById(`likes-${data.noteId}`);
        if (viewsEl) viewsEl.innerText = data.views;
        if (likesEl) likesEl.innerText = data.likes;
    });

    // Fetch Notes with Pagination (10 Notes Per Page)
    async function fetchNotes(page = 1, isSearch = false) {
        if (isLoading || (!hasMore && !isSearch)) return;
        
        isLoading = true;
        document.getElementById('loader').classList.add('active');

        try {
            const res = await fetch(`${API_BASE}?page=${page}&limit=10&search=${encodeURIComponent(currentSearch)}`);
            const responseData = await res.json();

            if (responseData.success) {
                if (isSearch) document.getElementById('notesGrid').innerHTML = '';
                
                renderNotes(responseData.data);
                hasMore = responseData.hasMore;
                currentPage = page;
            }
        } catch (err) {
            console.error('Error fetching notes:', err);
        } finally {
            isLoading = false;
            document.getElementById('loader').classList.remove('active');
        }
    }

    // Render Notes in HTML Layout
    function renderNotes(notes) {
        const grid = document.getElementById('notesGrid');
        
        notes.forEach(note => {
            const card = document.createElement('div');
            card.className = 'note-card';
            card.id = `note-${note._id}`;

            card.innerHTML = `
                <h3>${escapeHtml(note.title)}</h3>
                <p>${escapeHtml(note.content)}</p>
                
                <div class="note-stats-counter">
                    <span><i class="fa-regular fa-eye"></i> <span id="views-${note._id}">${note.views || 0}</span> Views</span>
                    <span class="like-btn" onclick="toggleLike('${note._id}', this)">
                        <i class="fa-regular fa-heart"></i> <span id="likes-${note._id}">${note.likes || 0}</span> Likes
                    </span>
                </div>
            `;
            
            // Trigger View Count automatically when note is opened/viewed
            card.onclick = () => triggerViewCount(note._id);
            grid.appendChild(card);
        });
    }

    // Infinite Scroll Event Trigger (Load 10 more notes on scroll to bottom)
    window.addEventListener('scroll', () => {
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
            if (hasMore && !isLoading) {
                fetchNotes(currentPage + 1);
            }
        }
    });

    // Trigger View API Call
    async function triggerViewCount(noteId) {
        try {
            await fetch(`${API_BASE}/${noteId}/view`, { method: 'POST' });
        } catch(e) { console.error(e); }
    }

    // Trigger Realtime Like/Unlike
    async function toggleLike(noteId, element) {
        event.stopPropagation();
        const isLiked = element.classList.contains('liked');
        const action = isLiked ? 'unlike' : 'like';

        element.classList.toggle('liked');

        try {
            await fetch(`${API_BASE}/${noteId}/like`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action })
            });
        } catch(e) { console.error(e); }
    }

    // Live Search Handle
    let searchDebounce;
    function handleSearch() {
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(() => {
            currentSearch = document.getElementById('searchInput').value;
            currentPage = 1;
            hasMore = true;
            fetchNotes(1, true);
        }, 400);
    }

    // Create Note Handler Prompt
    async function createNewNotePrompt() {
        const title = prompt("Enter Note Title:");
        const content = prompt("Enter Note Content:");

        if (!title || !content) return;

        try {
            const res = await fetch(API_BASE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, content, author: 'User' })
            });
            const data = await res.json();
            if (data.success) {
                location.reload();
            }
        } catch(err) { alert('Failed to create note'); }
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Initial Load
    fetchNotes(1);
</script>

</body>
</html>

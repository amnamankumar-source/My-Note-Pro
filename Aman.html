<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
    <title>My Note Pro - NEET Edition</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;500;600;700&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- html2pdf Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        /* ===== Header, Navbar, Sidebar, Blog Title Hide ===== */
        header, .header, #header, .Header, .header-widget,
        .navbar, nav, #navbar-iframe,
        #sidebar-wrapper, .sidebar, .sidebar-container,
        .blog-header, .header-inner, .header-section,
        .widget.Header, .site-title, .blog-title, .titlewrapper,
        h1.title, h1.header-title, h1:not(.app-title), h2.header-title {
          display: none !important;
        }
          
        /* ===== Hide Previous/Next Post Links ===== */
        .blog-pager, .blog-pager-newer-link, .blog-pager-older-link, 
        #blog-pager-newer-link, #blog-pager-older-link, .post-nav, 
        .post-pagination, .pagenavi, .post-navigation, .nextprev, 
        .newer-posts, .older-posts, .nav-links, .single-navigation,
        .prev-post, .next-post, #blog-pager {
          display: none !important;
          visibility: hidden !important;
          height: 0 !important;
          opacity: 0 !important;
        }
          
        /* ===== Content Full Width + Top ===== */
        body, .content, .post-body, .container, .main-wrapper, .page_body, .outer-container {
          margin: 0 !important;
          padding: 0 !important;
          top: 0px !important;
          width: 100% !important;
          max-width: 100% !important;
        }

        #footer, .footer, #footer-wrapper, .site-footer {
          background: #000000 !important;
          height: 1px !important;
          min-height: 1px !important;
          overflow: hidden !important;
          opacity: 0.01 !important;
          padding: 0 !important;
          margin: 0 !important;
        }
        #footer *, .footer *, #footer-wrapper *, .site-footer * {
          color: #000000 !important;
          font-size: 0px !important;
          line-height: 0 !important;
          pointer-events: none !important;
        }

        /* --- Pro Design Variables --- */
        :root {
            --bg-color: #f4f7f6; 
            --surface-color: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --primary-color: #4f46e5; 
            --primary-hover: #4338ca;
            --danger-color: #e53e3e;
            --danger-hover: #c53030;
            --success-color: #38a169;
            --voice-color: #d53f8c; 
            --border-color: #e2e8f0;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 15px 30px rgba(0,0,0,0.12);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-pill: 9999px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --editor-toolbar-bg: #f8fafc;
        }

        /* Dark Theme Variables */
        body.dark-mode {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --editor-toolbar-bg: #0f172a;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.4);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.5);
            --shadow-lg: 0 15px 30px rgba(0,0,0,0.6);
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: var(--radius-pill); }

        * { box-sizing: border-box !important; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--bg-color); color: var(--text-main);
            line-height: 1.6; min-height: 100vh; padding: 0px;
            overflow-x: hidden; display: flex; justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .app-container { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: 20px; margin: 0 auto; padding: 15px 0;}

        /* --- Header & Profile --- */
        .top-header-wrapper { display: flex !important; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; padding: 0 15px; }
        
        .profile-section { display: flex !important; align-items: center; gap: 15px; background: var(--surface-color); padding: 10px 20px; border-radius: var(--radius-pill); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); width: fit-content; transition: var(--transition); }
        .profile-section:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .profile-img-wrapper { position: relative; width: 45px; height: 45px; border-radius: 50%; overflow: hidden; border: 2px solid var(--primary-color); cursor: pointer; flex-shrink: 0; }
        .profile-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .profile-name { font-size: 16px; font-weight: 600; color: var(--text-main); outline: none; border-bottom: 1px dashed transparent; transition: var(--transition); padding: 2px 5px; border-radius: 4px; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .logo-area { display: flex !important; align-items: center; gap: 12px; cursor: pointer; transition: var(--transition); padding: 10px 15px; border-radius: var(--radius-md); }
        .logo-area:hover { background: rgba(79, 70, 229, 0.05); transform: scale(1.02); }
        .logo-icon { background: linear-gradient(135deg, var(--primary-color), var(--voice-color)); color: white; width: 45px; height: 45px; display: flex !important; align-items: center; justify-content: center; border-radius: 12px; font-size: 20px; box-shadow: var(--shadow-md); }
        .logo-area h1.app-title { display: block !important; font-size: 24px; font-weight: 700; color: var(--text-main); letter-spacing: -0.5px; margin: 0; }
        
        .header-actions { display: flex !important; align-items: center; gap: 15px; }
        
        /* --- HIGH-VISIBILITY BUTTON STYLES WITH !important --- */
        button, .btn-add, .close-modal-btn, .header-save-btn, .action-btn, .fab-add-btn, .theme-toggle-btn, .pin-toggle-btn {
            display: inline-flex !important;
            visibility: visible !important;
            opacity: 1 !important;
            align-items: center !important;
            justify-content: center !important;
            box-sizing: border-box !important;
            cursor: pointer !important;
            font-family: 'Poppins', sans-serif !important;
            white-space: nowrap !important;
        }

        .theme-toggle-btn { background: var(--surface-color) !important; border: 1.5px solid var(--border-color) !important; color: var(--text-main) !important; width: 45px !important; height: 45px !important; border-radius: 50% !important; font-size: 18px !important; box-shadow: var(--shadow-sm) !important; transition: var(--transition) !important; }
        .theme-toggle-btn:hover { transform: scale(1.1) rotate(15deg) !important; color: var(--primary-color) !important; border-color: var(--primary-color) !important; }
        
        .live-clock { text-align: right; background: var(--surface-color); padding: 10px 20px; border-radius: var(--radius-pill); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); }
        .live-clock .time { font-size: 20px; font-weight: 600; color: var(--primary-color); line-height: 1.2; }
        .live-clock .date { font-size: 12px; color: var(--text-muted); font-weight: 500; }

        /* --- Toolbar --- */
        .toolbar { display: flex !important; justify-content: space-between; align-items: center; gap: 20px; position: relative; z-index: 10; padding: 0 15px; }
        .search-wrapper { position: relative; flex: 1; max-width: 600px; display: flex !important; align-items: center; background: var(--surface-color); border-radius: var(--radius-pill); box-shadow: var(--shadow-md); padding: 5px 15px; border: 1px solid var(--border-color); transition: var(--transition); min-width: 0; }
        .search-wrapper:focus-within { border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15); transform: translateY(-2px); }
        .search-wrapper > i.fa-search { color: var(--text-muted); font-size: 16px; flex-shrink: 0; }
        .search-wrapper input[type="text"] { flex: 1; border: none; background: transparent; padding: 10px 10px; font-size: 14px; color: var(--text-main); outline: none; min-width: 0; }
        
        .filter-tools { display: flex !important; align-items: center; gap: 8px; flex-shrink: 0; }
        .clear-date-btn { background: rgba(229, 62, 62, 0.15) !important; color: var(--danger-color) !important; border: none !important; width: 32px !important; height: 32px !important; border-radius: 50% !important; display: none; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); flex-shrink: 0; }
        .calendar-btn { position: relative; width: 38px; height: 38px; border-radius: 50%; background: rgba(79, 70, 229, 0.12); color: var(--primary-color); display: flex !important; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); overflow: hidden; flex-shrink: 0; border: 1px solid rgba(79, 70, 229, 0.2); }
        .calendar-btn input[type="date"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: none; }
        
        .btn-add { background: linear-gradient(135deg, var(--primary-color), var(--primary-hover)) !important; color: #ffffff !important; border: none !important; padding: 12px 24px !important; border-radius: var(--radius-pill) !important; font-size: 15px !important; font-weight: 600 !important; gap: 8px !important; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4) !important; transition: var(--transition) !important; white-space: nowrap !important; }
        .btn-add:hover { transform: translateY(-2px) !important; box-shadow: 0 6px 20px rgba(79, 70, 229, 0.5) !important; }

        /* --- 1. Circle Slider --- */
        .quick-subjects-wrapper { 
            display: flex !important; 
            gap: 22px; 
            overflow-x: auto; 
            padding: 10px 0px; 
            margin: 0 !important; 
            width: 100% !important;
            scroll-snap-type: x mandatory; 
            -webkit-overflow-scrolling: touch; 
            scrollbar-width: none; 
        }
        .quick-subjects-wrapper::-webkit-scrollbar { display: none; }
        .subject-circle-item { display: flex !important; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; flex-shrink: 0; scroll-snap-align: start; transition: var(--transition); }
        .subject-circle-item:first-child { margin-left: 10px; }
        .subject-circle-item:last-child { margin-right: 10px; }
        .subject-circle-item:hover { transform: translateY(-4px); }
        .subject-ring { width: 72px; height: 72px; border-radius: 50%; padding: 3px; display: flex !important; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); background: var(--surface-color); transition: var(--transition); position: relative; }
        .bio-ring { border: 2.5px solid #10b981; }
        .phy-ring { border: 2.5px solid #3b82f6; }
        .chem-ring { border: 2.5px solid #f59e0b; }
        .zoo-ring { border: 2.5px solid #d946ef; }
        .all-ring { border: 2.5px solid var(--primary-color); }
        .trash-ring { border: 2.5px solid var(--danger-color); }
        .subject-ring img { width: 100% !important; height: 100% !important; object-fit: cover; border-radius: 50%; }
        .subject-circle-item span { font-size: 12px; font-weight: 600; color: var(--text-main); }

        /* --- Notes Grid --- */
        .notes-grid { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; align-items: stretch; transition: var(--transition); padding: 0 15px; }
        .note-card { background: var(--surface-color); border-radius: var(--radius-lg); padding: 25px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); transition: var(--transition); display: flex !important; flex-direction: column; gap: 16px; height: 100%; position: relative; overflow: hidden; }
        .note-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--primary-color), var(--voice-color)); opacity: 0; transition: var(--transition); }
        .note-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-5px); }
        .note-card:hover::before { opacity: 1; }
        
        .privacy-badge { position: absolute; top: 12px; right: 15px; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: var(--radius-pill); display: inline-flex; align-items: center; gap: 5px; cursor: pointer; transition: var(--transition); }
        .privacy-badge.private { background: rgba(229, 62, 62, 0.1); color: var(--danger-color); }
        .privacy-badge.public { background: rgba(56, 161, 105, 0.1); color: var(--success-color); }
        
        .note-card-header { display: flex !important; align-items: center; gap: 15px; width: 100%; margin-top: 10px; }
        .note-header-text { display: flex !important; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
        .note-circle-logo { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; background: var(--editor-toolbar-bg); display: flex !important; align-items: center; justify-content: center; flex-shrink: 0; }
        .note-author-tag { font-size: 11px; font-weight: 600; color: var(--primary-color); display: inline-flex !important; align-items: center; gap: 6px; background: rgba(79, 70, 229, 0.08); padding: 3px 10px; border-radius: var(--radius-pill); width: fit-content; }
        .note-card h3.clickable-title { font-size: 17px; color: var(--text-main); font-weight: 600; line-height: 1.3; cursor: pointer; transition: var(--transition); margin: 0; }
        .note-card h3.clickable-title:hover { color: var(--primary-color); text-decoration: underline; }
        .note-content-container { flex: 1; display: flex !important; flex-direction: column; cursor: pointer; }
        .note-body-html { font-size: 14px; line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; max-height: 110px; word-break: break-word; color: var(--text-muted); }
        .note-body-html img, .note-body-html video { max-width: 100%; border-radius: 8px; margin: 4px 0; max-height: 120px; object-fit: cover; }

        .note-footer { margin-top: auto; padding-top: 15px; border-top: 1px solid var(--border-color); display: flex !important; flex-direction: column; gap: 12px; }
        .note-footer-top { display: flex !important; justify-content: space-between; align-items: center; width: 100%; }
        .note-date { font-size: 12px; color: var(--text-muted); display: flex !important; align-items: center; gap: 6px; font-weight: 500; }
        .note-actions { display: flex !important; gap: 8px; flex-wrap: wrap; }
        
        .action-btn { width: 36px !important; height: 36px !important; border-radius: 10px !important; border: 1px solid var(--border-color) !important; transition: var(--transition) !important; background: var(--editor-toolbar-bg) !important; font-size: 14px !important; }
        .btn-edit { color: var(--primary-color) !important; } .btn-edit:hover { background: var(--primary-color) !important; color: white !important; border-color: var(--primary-color) !important; }
        .btn-delete { color: var(--danger-color) !important; } .btn-delete:hover { background: var(--danger-color) !important; color: white !important; border-color: var(--danger-color) !important; }
        .btn-restore { color: var(--success-color) !important; } .btn-restore:hover { background: var(--success-color) !important; color: white !important; border-color: var(--success-color) !important; }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 80px 20px; background: var(--surface-color); border-radius: var(--radius-lg); border: 2px dashed var(--border-color); }

        /* --- Modals --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(5px); z-index: 1000; display: flex !important; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1 !important; pointer-events: auto !important; }
        .modal-content.full-screen { width: 100%; height: 100%; max-width: 100vw; max-height: 100vh; background: var(--surface-color); display: flex !important; flex-direction: column; overflow: hidden; }

        /* --- Modal Header Controls --- */
        .modal-header { padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex !important; flex-direction: row !important; justify-content: space-between; align-items: center !important; background: var(--surface-color); gap: 15px; flex-shrink: 0; }
        .modal-header h2 { font-size: 18px; font-weight: 600; color: var(--text-main); display: flex !important; align-items: center; gap: 8px; margin: 0; white-space: nowrap; }
        
        .header-column-controls { display: flex !important; flex-direction: row !important; gap: 10px; align-items: center !important; flex-wrap: nowrap !important; }
        
        .close-modal-btn { background: rgba(229, 62, 62, 0.12) !important; color: var(--danger-color) !important; border: 1px solid rgba(229, 62, 62, 0.3) !important; padding: 8px 16px !important; border-radius: var(--radius-sm) !important; font-size: 13px !important; font-weight: 600 !important; gap: 6px !important; }
        .close-modal-btn:hover { background: var(--danger-color) !important; color: white !important; }
        
        .header-save-btn { padding: 8px 18px !important; border: none !important; background: linear-gradient(135deg, var(--primary-color), var(--primary-hover)) !important; color: white !important; border-radius: var(--radius-sm) !important; font-weight: 600 !important; font-size: 13px !important; gap: 6px !important; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3) !important; }
        .header-save-btn:hover { transform: translateY(-1px) !important; }

        .modal-body { flex: 1; overflow-y: auto; padding: 20px; display: flex !important; flex-direction: column; gap: 15px; width: 100%; max-width: 1000px; margin: 0 auto; min-height: 0; box-sizing: border-box !important; }
        
        .editor-header-with-logo { display: flex !important; align-items: center; gap: 12px; width: 100% !important; background: var(--editor-toolbar-bg); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 10px 14px; flex-shrink: 0; box-sizing: border-box !important; }
        .editor-title { flex: 1 !important; border: 1px solid var(--border-color) !important; border-radius: var(--radius-sm) !important; font-size: 16px !important; font-weight: 600 !important; color: var(--text-main) !important; padding: 10px 14px !important; outline: none !important; background: var(--surface-color) !important; width: 100% !important; box-sizing: border-box !important; }
        .editor-logo-changer { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--primary-color); display: flex !important; align-items: center; justify-content: center; flex-shrink: 0; background: var(--surface-color); }

        .pin-toggle-btn { background: var(--surface-color) !important; border: 1px solid var(--border-color) !important; padding: 8px 14px !important; border-radius: var(--radius-sm) !important; font-size: 13px !important; font-weight: 600 !important; gap: 6px !important; transition: var(--transition) !important; }
        .pin-toggle-btn.is-private { background: rgba(229, 62, 62, 0.1) !important; color: var(--danger-color) !important; border-color: rgba(229, 62, 62, 0.3) !important; }
        .pin-toggle-btn.is-public { background: rgba(56, 161, 105, 0.1) !important; color: var(--success-color) !important; border-color: rgba(56, 161, 105, 0.3) !important; }

        /* Toolbar Styles */
        .editor-toolbar { display: flex !important; gap: 8px; padding: 10px 15px; background: var(--editor-toolbar-bg); border-radius: var(--radius-md); border: 1px solid var(--border-color); flex-wrap: wrap; align-items: center; flex-shrink: 0; box-sizing: border-box !important; }
        .editor-toolbar button { background: var(--surface-color) !important; border: 1px solid var(--border-color) !important; color: var(--text-main) !important; padding: 8px 12px !important; border-radius: var(--radius-sm) !important; font-size: 14px !important; }
        .editor-toolbar button.btn-yt { color: #ff0000 !important; }
        .editor-toolbar button.btn-drive { color: #0f9d58 !important; }
        .editor-toolbar button.btn-media { color: #8b5cf6 !important; }

        /* Color Highlighter Circles */
        .color-circles-group { display: flex !important; align-items: center; gap: 6px; border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); padding: 0 8px; }
        .color-circle-btn { width: 22px !important; height: 22px !important; border-radius: 50% !important; border: 2px solid rgba(255,255,255,0.8) !important; cursor: pointer !important; padding: 0 !important; box-shadow: 0 0 3px rgba(0,0,0,0.3) !important; transition: transform 0.2s !important; }
        .color-circle-btn:hover { transform: scale(1.2) !important; }
        .bg-yellow { background-color: #fef08a !important; }
        .bg-green { background-color: #bbf7d0 !important; }
        .bg-red { background-color: #fecaca !important; }
        .bg-blue { background-color: #bfdbfe !important; }

        .editor-container { width: 100%; flex: 1; display: flex !important; flex-direction: column; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--surface-color); overflow: hidden; min-height: 250px; box-sizing: border-box !important; }
        .rich-editor-area { width: 100%; height: 100%; flex: 1; font-size: 16px; line-height: 1.8; color: var(--text-main); outline: none; padding: 20px; background: transparent; overflow-y: auto; box-sizing: border-box !important; }
        
        .rich-editor-area img { max-width: 100%; border-radius: var(--radius-md); margin: 10px 0; display: block; box-shadow: var(--shadow-sm); }
        .rich-editor-area video { max-width: 100%; border-radius: var(--radius-md); margin: 10px 0; display: block; }
        
        .pdf-attachment-card { display: flex; align-items: center; gap: 12px; background: var(--editor-toolbar-bg); border: 1px dashed var(--primary-color); padding: 12px 16px; border-radius: var(--radius-md); margin: 10px 0; width: fit-content; text-decoration: none; color: var(--text-main); font-weight: 500; }
        .pdf-attachment-card i { font-size: 24px; color: #e53e3e; }

        /* Media Slider Frames inside Note */
        .media-slider-container { display: flex !important; gap: 15px; overflow-x: auto; padding: 10px 0; margin: 10px 0; width: 100% !important; scroll-snap-type: x mandatory; scrollbar-width: thin; }
        .media-slider-card { flex: 0 0 auto; scroll-snap-align: start; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-color); background: #000; position: relative; }
        .media-slider-card.yt-card { width: 280px; height: 160px; }
        .media-slider-card.drive-card { width: 300px; height: 380px; background: var(--surface-color); }
        .media-slider-card iframe { width: 100%; height: 100%; border: none; }

        /* View-Only Note Display */
        .view-note-title { font-size: 24px; font-weight: 700; color: var(--text-main); margin-bottom: 15px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        .view-note-body { font-size: 16px; line-height: 1.8; color: var(--text-main); word-break: break-word; }

        .fab-add-btn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50% !important; background: linear-gradient(135deg, var(--primary-color), var(--voice-color)) !important; color: white !important; font-size: 24px !important; border: none !important; box-shadow: 0 10px 25px rgba(79, 70, 229, 0.5) !important; z-index: 900; }
        .fab-add-btn:hover { transform: scale(1.08) !important; }

        .toast-container { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 5000; display: flex !important; flex-direction: column; gap: 10px; pointer-events: none; align-items: center; }
        .toast { background: rgba(15, 23, 42, 0.95); color: white; padding: 12px 24px; border-radius: var(--radius-pill); font-size: 14px; font-weight: 500; display: flex !important; align-items: center; gap: 10px; opacity: 0; transform: translateY(30px); transition: all 0.4s ease; }
        .toast.show { opacity: 1 !important; transform: translateY(0) !important; }

        @media (max-width: 768px) {
            .btn-add { display: none !important; } 
            .notes-grid { grid-template-columns: 1fr; }
            .modal-header { padding: 10px 12px; }
            .modal-header h2 { font-size: 15px; }
            .modal-body { padding: 10px !important; }
            .fab-add-btn { bottom: 25px; right: 20px; width: 55px; height: 55px; }
            .header-column-controls button span { display: none; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header & Profile -->
        <div class="top-header-wrapper">
            <div class="header-left">
                <div class="logo-area" onclick="goHome()" title="Go Home">
                    <div class="logo-icon"><i class="fas fa-book-open"></i></div>
                    <h1 class="app-title">My Note Pro</h1>
                </div>
            </div>
            
            <div class="profile-section">
                <div class="profile-img-wrapper" onclick="document.getElementById('profile-img-upload').click()" title="Change Profile Picture">
                    <img alt="Profile" id="profile-img" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&h=150&q=80" />
                    <input accept="image/*" id="profile-img-upload" onchange="updateProfileImg(event)" style="display: none;" type="file" />
                </div>
                <div class="profile-name" contenteditable="true" id="profile-name" onblur="saveProfileName()" title="Click to edit name">NEET Aspirant</div>
            </div>

            <div class="header-actions">
                <button class="theme-toggle-btn" id="theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
                    <i class="fas fa-moon" id="theme-icon"></i>
                </button>
                <div class="live-clock">
                    <div class="time" id="live-time">00:00:00 AM</div>
                    <div class="date" id="live-date">...</div>
                </div>
            </div>
        </div>

        <!-- Main Toolbar -->
        <div class="toolbar">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input id="search-input" oninput="filterNotes()" placeholder="Search notes, NEET topics..." type="text" />
                <div class="filter-tools">
                    <button class="clear-date-btn" id="clear-date-btn" onclick="clearDateFilter()" title="Clear Date Filter">
                        <i class="fas fa-times"></i>
                    </button>
                    <div class="calendar-btn" title="Search notes by Date">
                        <i class="fas fa-calendar-alt"></i>
                        <input id="date-search-input" onchange="filterByDate()" type="date" />
                    </div>
                </div>
            </div>

            <button class="btn-add" onclick="openModal()">
                <i class="fas fa-pen-nib"></i> Write Note
            </button>
        </div>

        <!-- Quick Subject Slider -->
        <div class="quick-subjects-wrapper" id="quick-subjects-slider">
            <div class="subject-circle-item" onclick="filterBySubject('Biology')">
                <div class="subject-ring bio-ring">
                    <img alt="Biology" src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=150&h=150&q=80" />
                </div>
                <span>Biology</span>
            </div>
            <div class="subject-circle-item" onclick="filterBySubject('Zoology')">
                <div class="subject-ring zoo-ring">
                    <img alt="Zoology" src="https://images.unsplash.com/photo-1530026405186-ed1ea0ac7a63?auto=format&fit=crop&w=150&h=150&q=80" />
                </div>
                <span>Zoology</span>
            </div>
            <div class="subject-circle-item" onclick="filterBySubject('Physics')">
                <div class="subject-ring phy-ring">
                    <img alt="Physics" src="https://images.unsplash.com/photo-1635070041078-e363dbe005cb?auto=format&fit=crop&w=120&120&q=80" />
                </div>
                <span>Physics</span>
            </div>
            <div class="subject-circle-item" onclick="filterBySubject('Chemistry')">
                <div class="subject-ring chem-ring">
                    <img alt="Chemistry" src="https://images.unsplash.com/photo-1532187863486-abf9d39d66e8?auto=format&fit=crop&w=120&120&q=80" />
                </div>
                <span>Chemistry</span>
            </div>
            <div class="subject-circle-item" onclick="filterBySubject('Trash')">
                <div class="subject-ring trash-ring" style="align-items: center; background: var(--surface-color); display: flex; justify-content: center;">
                    <i class="fas fa-trash-alt" style="color: var(--danger-color); font-size: 26px;"></i>
                </div>
                <span style="color: var(--danger-color);">Recycle Bin</span>
            </div>
            <div class="subject-circle-item" onclick="filterBySubject('')">
                <div class="subject-ring all-ring">
                    <img alt="All Notes" src="https://images.unsplash.com/photo-1506784983877-45594efa4cbe?auto=format&fit=crop&w=120&120&q=80" />
                </div>
                <span>All Notes</span>
            </div>
        </div>

        <!-- Notes Grid Area -->
        <div class="notes-grid" id="notes-container"></div>
    </div>

    <!-- Floating Action Button -->
    <button class="fab-add-btn" id="fab-add-btn" onclick="openModal()" title="Add New Note">
        <i class="fas fa-plus"></i>
    </button>

    <!-- READ-ONLY VIEW MODAL -->
    <div class="modal-overlay" id="view-modal">
        <div class="modal-content full-screen">
            <div class="modal-header">
                <div class="header-left-group" style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
                    <h2><i class="fas fa-book-open"></i> Note Viewer</h2>
                    <div class="date-stamp" id="view-date-stamp" style="color: var(--text-muted); font-size: 11px;"></div>
                </div>
                <div class="header-column-controls">
                    <button class="close-modal-btn" onclick="closeViewModal()"><i class="fas fa-times"></i> Close</button>
                </div>
            </div>
            
            <div class="modal-body" id="view-modal-body">
                <div class="view-note-title" id="view-note-title"></div>
                <div class="view-note-body" id="view-note-content"></div>
            </div>
        </div>
    </div>

    <!-- FULL SCREEN EDITOR MODAL -->
    <div class="modal-overlay" id="editor-modal">
        <div class="modal-content full-screen">
            <div class="modal-header">
                <h2><i class="fas fa-edit"></i> <span id="modal-heading-text">Note Editor</span></h2>
                
                <div class="header-column-controls">
                    <button class="pin-toggle-btn is-private" id="modal-pin-btn" onclick="toggleModalPrivacy()">
                        <i class="fas fa-lock" id="modal-pin-icon"></i> <span id="modal-pin-text">Private Note</span>
                    </button>
                    <button class="header-save-btn" onclick="saveNoteAndClose()"><i class="fas fa-check-circle"></i> <span>Save Note</span></button>
                    <button class="close-modal-btn" onclick="closeModal()"><i class="fas fa-times"></i> <span>Close</span></button>
                </div>
            </div>
            
            <div class="modal-body">
                <div class="editor-header-with-logo">
                    <div class="editor-logo-changer">
                        <i class="fas fa-sticky-note" style="color: var(--primary-color); font-size: 20px;"></i>
                    </div>
                    <input class="editor-title" id="note-title" placeholder="Note Title..." type="text" />
                </div>

                <!-- Editor Toolbar with Color Circles and Media Button -->
                <div class="editor-toolbar">
                    <button onclick="execCmd('bold')" title="Bold"><i class="fas fa-bold"></i></button>
                    
                    <!-- Color Highlighter Circles -->
                    <div class="color-circles-group" title="Text Highlighter Circles">
                        <button class="color-circle-btn bg-yellow" onclick="highlightText('#fef08a')" title="Yellow Highlight"></button>
                        <button class="color-circle-btn bg-green" onclick="highlightText('#bbf7d0')" title="Green Highlight"></button>
                        <button class="color-circle-btn bg-red" onclick="highlightText('#fecaca')" title="Red Highlight"></button>
                        <button class="color-circle-btn bg-blue" onclick="highlightText('#bfdbfe')" title="Blue Highlight"></button>
                    </div>

                    <button onclick="execCmd('italic')" title="Italic"><i class="fas fa-italic"></i></button>
                    <button onclick="execCmd('underline')" title="Underline"><i class="fas fa-underline"></i></button>
                    <button onclick="execCmd('insertUnorderedList')" title="Bullet List"><i class="fas fa-list-ul"></i></button>
                    <button onclick="execCmd('insertOrderedList')" title="Numbered List"><i class="fas fa-list-ol"></i></button>
                    <input onchange="execCmd('foreColor', this.value)" title="Text Color" type="color" />
                    
                    <button onclick="insertCustomLink()" title="Add URL Link"><i class="fas fa-link"></i> Link</button>
                    <button class="btn-yt" onclick="insertYouTubeEmbed()" title="Add YouTube Video/Shorts/Live"><i class="fab fa-youtube"></i> YouTube</button>
                    
                    <!-- Media Button (Upload PDF, Image, Video) -->
                    <button class="btn-media" onclick="document.getElementById('multiple-media-input').click()" title="Upload Images, PDFs, Videos">
                        <i class="fas fa-photo-video"></i> Media
                    </button>
                    <input id="multiple-media-input" type="file" accept="image/*,video/*,application/pdf" multiple style="display: none;" onchange="handleMultipleMediaUpload(event)">

                    <button class="btn-drive" onclick="insertDriveEmbed()" title="Add Google Drive PDF/Image/Video"><i class="fab fa-google-drive"></i> Drive</button>
                </div>

                <div class="editor-container">
                    <div class="rich-editor-area" contenteditable="true" data-placeholder="Start typing your note here..." id="note-editor"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container"></div>

    <!-- JavaScript Logic -->
    <script>
        const API_BASE_URL = 'https://my-note-pro-1.onrender.com/api/notes';

        const DEFAULT_NEET_NOTES = [
            {
                id: 'neet-perm-1',
                title: '📌 NEET Biology: Human Physiology Key Revision',
                content: '<b>Important Points for NEET:</b><br>1. <i>SA Node</i> is the natural pacemaker of the heart.<br>2. Digestion of proteins starts in the stomach with Pepsin.<br>3. Tidal Volume (TV) = ~500 mL.',
                createdAt: 'Permanent Note',
                isPrivate: false,
                isPermanent: true,
                inTrash: false,
                subject: 'Biology'
            },
            {
                id: 'neet-perm-2',
                title: '⚡ NEET Physics: Important Formulae Sheet',
                content: '<b>Quick Formulae:</b><br>1. Ohm\'s Law: <i>V = IR</i><br>2. Kinetic Energy: <i>KE = ½ mv²</i><br>3. Force: <i>F = ma</i>',
                createdAt: 'Permanent Note',
                isPermanent: true,
                inTrash: false,
                subject: 'Physics'
            },
            {
                id: 'neet-perm-3',
                title: '🧪 NEET Chemistry: Organic Named Reactions',
                content: '<b>Must-Remember Reactions:</b><br>1. <b>Wurtz Reaction:</b> Alkyl halide + Na in dry ether → Higher Alkane.<br>2. <b>Aldol Condensation:</b> Aldehydes/Ketones with α-hydrogen.<br>3. <b>Kolbe\'s Reaction:</b> Phenol to Salicylic acid.',
                createdAt: 'Permanent Note',
                isPrivate: false,
                isPermanent: true,
                inTrash: false,
                subject: 'Chemistry'
            }
        ];

        let notes = JSON.parse(localStorage.getItem('my_pro_notes')) || [];
        
        function initializeNeetNotes() {
            DEFAULT_NEET_NOTES.forEach(permNote => {
                if (!notes.some(n => n.id === permNote.id || n._id === permNote.id)) {
                    notes.push(permNote);
                }
            });
            saveNotesToStorage();
        }

        let currentEditId = null;
        let selectedSubjectFilter = '';
        let currentModalIsPrivate = true;

        async function fetchNotesFromBackend() {
            try {
                const response = await fetch(`${API_BASE_URL}`);
                if (response.ok) {
                    const serverNotes = await response.json();
                    
                    serverNotes.forEach(serverNote => {
                        const index = notes.findIndex(n => (n._id && n._id === serverNote._id) || (n.id && n.id === serverNote._id));
                        const formattedNote = {
                            id: serverNote._id,
                            _id: serverNote._id,
                            title: serverNote.title,
                            content: serverNote.content,
                            subject: serverNote.subject || 'NEET',
                            isPrivate: serverNote.isPrivate,
                            createdAt: serverNote.createdAt,
                            inTrash: false
                        };

                        if (index > -1) {
                            notes[index] = formattedNote;
                        } else {
                            notes.unshift(formattedNote);
                        }
                    });

                    saveNotesToStorage();
                    renderNotes();
                }
            } catch (err) {
                console.warn('Backend server offline, using local cache:', err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateClock();
            setInterval(updateClock, 1000);
            initializeNeetNotes();
            loadProfile();
            renderNotes();
            fetchNotesFromBackend();
        });

        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const dateStr = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
            
            document.getElementById('live-time').innerText = timeStr;
            document.getElementById('live-date').innerText = dateStr;
        }

        function saveProfileName() {
            localStorage.setItem('profile_name', document.getElementById('profile-name').innerText);
            showToast('Profile name saved!', 'info');
        }

        function updateProfileImg(event) {
            const reader = new FileReader();
            reader.onload = function() {
                document.getElementById('profile-img').src = reader.result;
                localStorage.setItem('profile_img', reader.result);
                showToast('Profile image updated!', 'success');
            };
            if(event.target.files[0]) reader.readAsDataURL(event.target.files[0]);
        }

        function loadProfile() {
            const savedName = localStorage.getItem('profile_name');
            const savedImg = localStorage.getItem('profile_img');
            if(savedName) document.getElementById('profile-name').innerText = savedName;
            if(savedImg) document.getElementById('profile-img').src = savedImg;
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('theme-icon').className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('theme_mode', isDark ? 'dark' : 'light');
        }

        function execCmd(command, value = null) {
            document.execCommand(command, false, value);
        }

        /* --- Text Highlighter Circle Logic --- */
        function highlightText(color) {
            document.execCommand('hiliteColor', false, color);
        }

        /* --- Media Upload (Multiple Files: Image, Video, PDF) --- */
        function handleMultipleMediaUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const editor = document.getElementById('note-editor');

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const result = e.target.result;
                    if (file.type.startsWith('image/')) {
                        const img = document.createElement('img');
                        img.src = result;
                        editor.appendChild(img);
                    } else if (file.type.startsWith('video/')) {
                        const video = document.createElement('video');
                        video.src = result;
                        video.controls = true;
                        editor.appendChild(video);
                    } else if (file.type === 'application/pdf') {
                        const pdfCard = document.createElement('a');
                        pdfCard.className = 'pdf-attachment-card';
                        pdfCard.href = result;
                        pdfCard.target = '_blank';
                        pdfCard.download = file.name;
                        pdfCard.innerHTML = `<i class="fas fa-file-pdf"></i> <span>${file.name} (Click to View/Download)</span>`;
                        editor.appendChild(pdfCard);
                    }
                };
                reader.readAsDataURL(file);
            });

            showToast(`${files.length} media file(s) attached!`, 'success');
            event.target.value = '';
        }

        /* --- URL / YOUTUBE / DRIVE EMBED LOGIC --- */
        function insertCustomLink() {
            const url = prompt('Enter URL link:');
            if (url) {
                document.execCommand('createLink', false, url);
            }
        }

        function insertYouTubeEmbed() {
            const url = prompt('Paste YouTube URL (Video, Shorts, Live, Embed, Share link):');
            if (!url) return;

            let videoId = '';
            if (url.includes('shorts/')) {
                videoId = url.split('shorts/')[1].split('?')[0];
            } else if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1].split('?')[0];
            } else if (url.includes('watch?v=')) {
                videoId = url.split('watch?v=')[1].split('&')[0];
            } else if (url.includes('embed/')) {
                videoId = url.split('embed/')[1].split('?')[0];
            } else if (url.includes('live/')) {
                videoId = url.split('live/')[1].split('?')[0];
            }

            if (videoId) {
                const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=0`;
                const editor = document.getElementById('note-editor');
                
                let slider = editor.querySelector('.media-slider-container');
                if (!slider) {
                    slider = document.createElement('div');
                    slider.className = 'media-slider-container';
                    editor.appendChild(slider);
                }

                const card = document.createElement('div');
                card.className = 'media-slider-card yt-card';
                card.innerHTML = `<iframe src="${embedUrl}" allowfullscreen loading="lazy"></iframe>`;
                slider.appendChild(card);
                showToast('YouTube video added to slider!', 'success');
            } else {
                showToast('Invalid YouTube URL format!', 'error');
            }
        }

        function insertDriveEmbed() {
            const url = prompt('Paste Google Drive File/Share/Embed URL:');
            if (!url) return;

            let embedUrl = url;
            if (url.includes('/view')) {
                embedUrl = url.replace('/view', '/preview');
            } else if (!url.includes('/preview')) {
                const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    embedUrl = `https://drive.google.com/file/d/${match[1]}/preview`;
                }
            }

            const editor = document.getElementById('note-editor');
            let slider = editor.querySelector('.media-slider-container');
            if (!slider) {
                slider = document.createElement('div');
                slider.className = 'media-slider-container';
                editor.appendChild(slider);
            }

            const card = document.createElement('div');
            card.className = 'media-slider-card drive-card';
            card.innerHTML = `<iframe src="${embedUrl}" allow="autoplay" loading="lazy"></iframe>`;
            slider.appendChild(card);
            showToast('Google Drive media added in A4 slider!', 'success');
        }

        /* --- READ-ONLY NOTE VIEWER --- */
        function viewNote(noteId) {
            const note = notes.find(n => n.id === noteId || n._id === noteId);
            if(!note) return;

            document.getElementById('view-note-title').innerText = note.title;
            document.getElementById('view-note-content').innerHTML = note.content;
            document.getElementById('view-date-stamp').innerHTML = `<i class="fas fa-clock"></i> ${note.createdAt} | Subject: ${note.subject || 'NEET'}`;
            
            document.getElementById('view-modal').classList.add('active');
        }

        function closeViewModal() {
            document.getElementById('view-modal').classList.remove('active');
        }

        function openModal(noteId = null) {
            currentEditId = noteId;
            const modal = document.getElementById('editor-modal');
            const titleInput = document.getElementById('note-title');
            const editor = document.getElementById('note-editor');
            const headingText = document.getElementById('modal-heading-text');

            if(noteId !== null) {
                const note = notes.find(n => n.id === noteId || n._id === noteId);
                if(note) {
                    titleInput.value = note.title;
                    editor.innerHTML = note.content;
                    currentModalIsPrivate = note.isPrivate !== undefined ? note.isPrivate : true;
                    headingText.innerText = 'Edit Note';
                }
            } else {
                titleInput.value = '';
                editor.innerHTML = '';
                currentModalIsPrivate = true;
                headingText.innerText = 'Create New Note';
            }

            updateModalPinUI();
            modal.classList.add('active');
        }

        function toggleModalPrivacy() {
            currentModalIsPrivate = !currentModalIsPrivate;
            updateModalPinUI();
        }

        function updateModalPinUI() {
            const pinBtn = document.getElementById('modal-pin-btn');
            const pinIcon = document.getElementById('modal-pin-icon');
            const pinText = document.getElementById('modal-pin-text');

            if (currentModalIsPrivate) {
                pinBtn.className = 'pin-toggle-btn is-private';
                pinIcon.className = 'fas fa-lock';
                pinText.innerText = 'Private';
            } else {
                pinBtn.className = 'pin-toggle-btn is-public';
                pinIcon.className = 'fas fa-globe';
                pinText.innerText = 'Public';
            }
        }

        function closeModal() {
            document.getElementById('editor-modal').classList.remove('active');
            currentEditId = null;
        }

        async function saveNoteAndClose() {
            const title = document.getElementById('note-title').value.trim();
            const content = document.getElementById('note-editor').innerHTML.trim();

            if(!title && !content) {
                showToast('Cannot save an empty note!', 'error');
                return;
            }

            const now = new Date();
            const timeStamp = now.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const notePayload = {
                title: title || 'Untitled Note',
                content: content,
                subject: selectedSubjectFilter || 'NEET',
                isPrivate: currentModalIsPrivate,
                createdAt: timeStamp
            };

            showToast('Saving note to MongoDB...', 'info');

            try {
                if (currentEditId !== null) {
                    const noteIndex = notes.findIndex(n => n.id === currentEditId || n._id === currentEditId);
                    const targetNote = notes[noteIndex];

                    if (targetNote && targetNote._id && !targetNote._id.startsWith('neet-perm-')) {
                        const res = await fetch(`${API_BASE_URL}/${targetNote._id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(notePayload)
                        });
                        const updated = await res.json();
                        notes[noteIndex] = { ...updated, id: updated._id };
                    } else if (noteIndex > -1) {
                        notes[noteIndex] = { ...notes[noteIndex], ...notePayload };
                    }
                } else {
                    const res = await fetch(API_BASE_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(notePayload)
                    });
                    
                    if (res.ok) {
                        const createdNote = await res.json();
                        notes.unshift({ ...createdNote, id: createdNote._id });
                    } else {
                        const localNote = { id: 'note-' + Date.now(), ...notePayload, inTrash: false };
                        notes.unshift(localNote);
                    }
                }
            } catch (err) {
                console.error('API Error, saved locally:', err);
                if (currentEditId === null) {
                    notes.unshift({ id: 'note-' + Date.now(), ...notePayload, inTrash: false });
                }
            }

            saveNotesToStorage();
            renderNotes();
            closeModal();
            showToast(currentModalIsPrivate ? 'Private Note Saved!' : 'Published Publicly!', 'success');
        }

        async function toggleCardPrivacy(id, event) {
            event.stopPropagation();
            const note = notes.find(n => n.id === id || n._id === id);
            if(note) {
                note.isPrivate = !note.isPrivate;
                
                if (note._id && !note._id.startsWith('neet-perm-')) {
                    try {
                        await fetch(`${API_BASE_URL}/${note._id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ isPrivate: note.isPrivate })
                        });
                    } catch(err) { console.error('Failed to update privacy', err); }
                }

                saveNotesToStorage();
                renderNotes();
                showToast(note.isPrivate ? 'Note set to Private' : 'Note Published Publicly!', 'info');
            }
        }

        function saveNotesToStorage() {
            localStorage.setItem('my_pro_notes', JSON.stringify(notes));
        }

        function renderNotes(filterList = null) {
            const container = document.getElementById('notes-container');
            container.innerHTML = '';

            let displayNotes = filterList || notes;

            if(selectedSubjectFilter === 'Trash') {
                displayNotes = displayNotes.filter(n => n.inTrash);
            } else {
                displayNotes = displayNotes.filter(n => !n.inTrash);
                if(selectedSubjectFilter) {
                    displayNotes = displayNotes.filter(n => n.subject && n.subject.toLowerCase() === selectedSubjectFilter.toLowerCase());
                }
            }

            if(displayNotes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-folder-open" style="font-size: 50px; opacity: 0.3;"></i>
                        <h2>No Notes Found</h2>
                        <p>Write a new note or change filters.</p>
                    </div>`;
                return;
            }

            displayNotes.forEach(note => {
                const card = document.createElement('div');
                card.className = `note-card ${note.inTrash ? 'in-trash-card' : ''}`;
                const isPrivate = note.isPrivate !== undefined ? note.isPrivate : true;
                const noteId = note._id || note.id;

                card.innerHTML = `
                    <div class="privacy-badge ${isPrivate ? 'private' : 'public'}" onclick="toggleCardPrivacy('${noteId}', event)" title="Click to toggle Private/Public">
                        <i class="fas ${isPrivate ? 'fa-lock' : 'fa-globe'}"></i> ${isPrivate ? 'Private' : 'Public'}
                    </div>

                    <div class="note-card-header">
                        <div class="note-circle-logo">
                            <i class="fas fa-book" style="color: var(--primary-color); font-size: 20px;"></i>
                        </div>
                        <div class="note-header-text">
                            <span class="note-author-tag">${note.subject || 'NEET'}</span>
                            <h3 class="clickable-title" onclick="viewNote('${noteId}')">${escapeHtml(note.title)}</h3>
                        </div>
                    </div>
                    <div class="note-content-container" onclick="viewNote('${noteId}')">
                        <div class="note-body-html">${note.content}</div>
                    </div>
                    <div class="note-footer">
                        <div class="note-footer-top">
                            <div class="note-date"><i class="far fa-clock"></i> ${note.createdAt}</div>
                            <div class="note-actions">
                                ${note.inTrash ? `
                                    <button class="action-btn btn-restore" onclick="restoreNote('${noteId}')" title="Restore"><i class="fas fa-undo"></i></button>
                                    <button class="action-btn btn-delete" onclick="permanentlyDeleteNote('${noteId}')" title="Delete"><i class="fas fa-times"></i></button>
                                ` : `
                                    <button class="action-btn btn-edit" onclick="openModal('${noteId}')" title="Edit"><i class="fas fa-pen"></i></button>
                                    <button class="action-btn btn-delete" onclick="moveToTrash('${noteId}')" title="Trash"><i class="fas fa-trash"></i></button>
                                `}
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function moveToTrash(id) {
            const note = notes.find(n => n.id === id || n._id === id);
            if(note) {
                note.inTrash = true;
                saveNotesToStorage();
                renderNotes();
                showToast('Moved to Recycle Bin', 'info');
            }
        }

        function restoreNote(id) {
            const note = notes.find(n => n.id === id || n._id === id);
            if(note) {
                note.inTrash = false;
                saveNotesToStorage();
                renderNotes();
                showToast('Note restored!', 'success');
            }
        }

        async function permanentlyDeleteNote(id) {
            if(confirm('Delete this note permanently?')) {
                const targetNote = notes.find(n => n.id === id || n._id === id);
                
                if (targetNote && targetNote._id && !targetNote._id.startsWith('neet-perm-')) {
                    try {
                        await fetch(`${API_BASE_URL}/${targetNote._id}`, { method: 'DELETE' });
                    } catch (err) { console.error('Error deleting from server', err); }
                }

                notes = notes.filter(n => n.id !== id && n._id !== id);
                saveNotesToStorage();
                renderNotes();
                showToast('Permanently deleted', 'error');
            }
        }

        function filterBySubject(subject) {
            selectedSubjectFilter = subject;
            renderNotes();
        }

        function filterNotes() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = notes.filter(n => 
                n.title.toLowerCase().includes(query) || 
                n.content.toLowerCase().includes(query)
            );
            renderNotes(filtered);
        }

        function filterByDate() {
            const dateVal = document.getElementById('date-search-input').value;
            if(!dateVal) return;
            document.getElementById('clear-date-btn').style.display = 'inline-flex';
            const formattedDate = new Date(dateVal).toLocaleDateString([], { month: 'short', day: 'numeric' });
            const filtered = notes.filter(n => n.createdAt.includes(formattedDate));
            renderNotes(filtered);
        }

        function clearDateFilter() {
            document.getElementById('date-search-input').value = '';
            document.getElementById('clear-date-btn').style.display = 'none';
            renderNotes();
        }

        function goHome() {
            selectedSubjectFilter = '';
            document.getElementById('search-input').value = '';
            clearDateFilter();
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas fa-info-circle"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
